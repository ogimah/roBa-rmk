name: Build RMK firmware
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
#   push:
#     paths:
#       - "**"

jobs:
  # build:
  #   uses: haobogu/rmk/.github/workflows/user_build.yml@main
  #   with:
  #     keyboard_toml_path: "keyboard.toml"
  #     vial_json_path: "vial.json"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install clang dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Install Rust 1.85.1 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.1
          targets: thumbv7em-none-eabihf

      - name: Show rustc version
        run: rustc --version

      - name: Install cargo-make
        run: cargo +1.85.1 install cargo-make --locked

      - name: Build UF2
        run: cargo +1.85.1 make uf2

      - name: Calculate hash
        run: |
          sha256sum *.uf2

      - name: Upload artifact (central)
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: roBa-central.uf2

      - name: Upload artifact (peripheral)
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: roBa-peripheral.uf2
