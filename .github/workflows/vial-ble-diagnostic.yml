name: Build Vial 0.7.5 BLE diagnostic
on:
  workflow_dispatch:
  push:
    branches: [diagnose/vial075-ble]
    paths: ['diagnostics/vial075/**', '.github/workflows/vial-ble-diagnostic.yml']
permissions:
  contents: read
  checks: write
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: task-source
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: vial-kb/vial-gui
          ref: e42622c352b69eff523a467718db487ab9c9cbf2
          path: vial
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.6.8'
          architecture: x64
      - name: Add logging without changing discovery
        run: |
          python task-source/diagnostics/vial075/prepare.py vial
          python task-source/diagnostics/vial075/test_diagnostic.py vial
      - name: Install official-version Python dependencies
        working-directory: vial
        run: |
          python ../task-source/diagnostics/vial075/install.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Qt legacy runtime as in upstream Windows CI
        run: |
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/3/2/2/3224B87F-CFA0-4E70-BDA3-3DE650EFEBA5/vcredist_x64.exe' -OutFile "$env:RUNNER_TEMP/vcredist_x64.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP/vcredist_x64.exe" -ArgumentList '/install','/quiet','/norestart' -Wait
      - name: Freeze portable diagnostic application
        working-directory: vial
        run: |
          python ../task-source/diagnostics/vial075/freeze.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test frozen app on Windows
        working-directory: vial
        run: |
          $diagnosticExe = Join-Path $PWD 'target/Vial BLE Diagnostic/Vial BLE Diagnostic.exe'
          $diagnosticProcess = Start-Process -FilePath $diagnosticExe -PassThru
          Start-Sleep -Seconds 8
          if ($diagnosticProcess.HasExited) { throw "Diagnostic app exited early: $($diagnosticProcess.ExitCode)" }
          $diagnosticProcess.Kill()
          $diagnosticLog = Join-Path (Split-Path $diagnosticExe) 'vial-ble-diagnostic.log'
          if (!(Select-String -Path $diagnosticLog -Pattern 'BLE_DIAG_START' -Quiet)) { throw 'Portable diagnostic log was not created' }
          Remove-Item $diagnosticLog
      - name: Package application and corresponding source
        working-directory: vial
        run: |
          $bundle = 'target/Vial BLE Diagnostic'
          Copy-Item COPYING "$bundle/COPYING"
          Copy-Item ../task-source/diagnostics/vial075/README-ja.txt "$bundle/README-ja.txt"
          Copy-Item diagnostic-dependencies.txt "$bundle/diagnostic-dependencies.txt"
          New-Item -ItemType Directory "$bundle/diagnostic-source" | Out-Null
          Copy-Item ../task-source/diagnostics/vial075/*.py "$bundle/diagnostic-source/"
          Copy-Item ../task-source/.github/workflows/vial-ble-diagnostic.yml "$bundle/diagnostic-source/"
          git archive --format=zip --output="$bundle/diagnostic-source/vial-0.7.5-upstream.zip" HEAD
          Compress-Archive -Path $bundle -DestinationPath ../Vial-0.7.5-BLE-Diagnostic-win.zip
          Get-FileHash ../Vial-0.7.5-BLE-Diagnostic-win.zip -Algorithm SHA256
      - name: Upload portable diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Vial-0.7.5-BLE-Diagnostic-win.zip
          path: Vial-0.7.5-BLE-Diagnostic-win.zip
          archive: false
          if-no-files-found: error
      - name: Expose failure diagnostics through Checks API
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $details = ''
          foreach ($logPath in @('vial/dependency-install.log', 'vial/freeze.log', 'vial/target/Vial BLE Diagnostic/vial-ble-diagnostic.log')) {
            if (Test-Path $logPath) {
              $details += "`n$logPath`n" + (Get-Content $logPath -Raw)
            }
          }
          if ($details.Length -gt 50000) { $details = $details.Substring($details.Length - 50000) }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/jobs" | ConvertFrom-Json
          $checkId = ($jobs.jobs | Where-Object { $_.name -eq 'windows' } | Select-Object -First 1).id
          $body = @{ output = @{ title = 'Vial diagnostic build output'; summary = 'Windows packaging or startup failed. See captured output.'; text = ('```text' + "`n" + $details + "`n" + '```') } }
          $body | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/check-output.json"
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/check-runs/$checkId" --input "$env:RUNNER_TEMP/check-output.json" | Out-Null
