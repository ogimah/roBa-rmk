[aliases]
# User0 - User(N-1): switch to specific profile, where N is ble_profiles_num
bt_sel_0 = "User0"
bt_sel_1 = "User1"
bt_sel_2 = "User2"
bt_sel_3 = "User3"
bt_sel_4 = "User4"

# UserN: switch to next profile
bt_next = "User5"

# User(N+1): switch to previous profile
bt_prev = "User6"

# User(N+2): clear current profile bond info
bt_clr = "User7"

# User(N+3): switch default output between USB/BLE
bt_switch = "User8"

[[layer]]
name = "Layer 0 - Default"
keys = """
Q  W  E  R  T  Y  U  I  O  P
A  S  D  F  G  _  LT(4,International4)  H  J  K  L  TD(4)
Z  X  C  V  B  TD(2)  International5  N  M  Comma  Dot  TD(3)
TD(0)  TD(1)  LAlt  LT(3,Tab)  LT(2,Escape)  LT(1,Space)  Enter  Backspace  Delete
No  No  No  No
No  No  No  No
No  No  No  No
"""
